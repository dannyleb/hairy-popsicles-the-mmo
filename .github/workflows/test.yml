name: Test

# Runs the server test suites (tests/run.mjs) on every push and pull request.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for the database suite (production uses Neon).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true  # the newest 22.x (security fixes), not whatever the runner has cached
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts  # no package install scripts (supply-chain worms run there)

      - name: Test
        run: npm test
