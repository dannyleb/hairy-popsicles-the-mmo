name: Deploy client to GitHub Pages

# Every push and pull request builds the client; only main is deployed.
# The server deploys separately on Render (see render.yaml).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# The build runs npm install scripts, so it only gets to read. Only the deploy
# job, which runs no project code, can publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where Pages serves the site: the custom domain's root (hairypopsicles.com)
  # once it's set in the repo's Pages settings, or /<repo-name>/ on github.io
  # before. Read-only, and runs no project code.
  site:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@v5

  build:
    needs: site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Built for wherever Pages serves it (see the site job). Changing the
      # custom domain needs a redeploy: Actions > this workflow > Run workflow.
      - name: Build client
        env:
          VITE_SITE_URL: ${{ needs.site.outputs.base_url }}/
        run: npm run build -w @hptm/client -- --base=${{ needs.site.outputs.base_path }}/

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
