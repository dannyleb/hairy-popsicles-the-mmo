services:
  - type: web
    name: hairy-popsicles-mmo-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm run start -w @hptm/server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Signs players' saves. Must stay the same across deploys, or every save is lost.
      - key: PROFILE_SECRET
        generateValue: true
      # Opens the admin page at /admin. Find it under the service's Environment tab.
      - key: ADMIN_KEY
        generateValue: true
      # Neon Postgres, pooled and direct (from `neon env pull`, or the Neon
      # console's Connect button). Without them, saves live only in memory.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
