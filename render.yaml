services:
  - type: web
    name: hairy-popsicles-mmo-server
    runtime: node
    plan: free
    region: oregon
    # No install scripts: the build sees the secrets below, and a hijacked
    # package's install script (the Shai-Hulud worms) is how they get stolen.
    # Nothing here needs one (msgpackr's native speed-up loads without it).
    buildCommand: npm ci --ignore-scripts
    startCommand: npm run start -w @hptm/server
    healthCheckPath: /
    envVars:
      # Bump on every Node.js security release for 22.x
      # (nodejs.org/en/blog/vulnerability); 22.23.4 has the October 2026 fixes.
      - key: NODE_VERSION
        value: 22.23.4
      # Signs players' saves. Must stay the same across deploys, or every save is lost.
      - key: PROFILE_SECRET
        generateValue: true
      # Opens the admin page at /admin. Find it under the service's Environment tab.
      - key: ADMIN_KEY
        generateValue: true
      # Neon Postgres, pooled and direct (from `neon env pull`, or the Neon
      # console's Connect button). Without them, saves live only in memory.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
