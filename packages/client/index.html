<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e0608" />
  <title>Hairy Popsicles: The MMO</title>
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/rubik-wet-paint.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/patrick-hand.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* Inline so the loading screen shows before the game's JavaScript has downloaded. */
    /* Self-hosted (SIL Open Font License, see fonts/*-OFL.txt); relative URLs so they work under any base path. */
    @font-face { font-family: "Rubik Wet Paint"; src: url(fonts/rubik-wet-paint.woff2) format("woff2"); font-display: swap; }
    @font-face { font-family: "Patrick Hand"; src: url(fonts/patrick-hand.woff2) format("woff2"); font-display: swap; }
    :root {
      --flesh: #e9b9a0;
      --flesh-dim: #c98f7d;
      --blood: #8e2b2f;
      --ink: #0e0608;
      --text: #f0d9c8;
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); }
    #app { width: 100vw; height: 100vh; }
    #vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 45%, rgba(8, 3, 5, 0.5) 78%, rgba(5, 2, 3, 0.9) 100%);
    }
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 24px; box-sizing: border-box;
      background: radial-gradient(circle at 50% 40%, rgba(150, 60, 35, 0.32), transparent 55%), var(--ink);
      font-family: "Patrick Hand", system-ui, sans-serif;
      transition: opacity 0.45s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .logo {
      margin: 0; font-family: "Rubik Wet Paint", "Patrick Hand", cursive; font-weight: 400;
      font-size: clamp(44px, 13vw, 84px); line-height: 0.95; color: var(--flesh);
      text-shadow: 0 3px 0 #5b2a3a, 0 0 28px rgba(255, 140, 90, 0.25);
    }
    .logo-sub {
      margin: 6px 0 0; font-size: 18px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--flesh-dim);
    }
    .load-bar {
      position: relative; width: min(280px, 70vw); height: 12px; margin: 34px auto 0;
      border-radius: 999px; background: #2a1418; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }
    .load-fill {
      position: relative; height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(180deg, #e08a7c, #9a3034 70%, #6e1d22);
      transition: width 0.2s ease;
    }
    /* A drop of something gathering at the end of the bar and falling off. */
    .load-fill::after {
      content: ""; position: absolute; right: 2px; top: 7px; width: 7px; height: 9px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; background: #9a3034;
      animation: drip 1.8s ease-in infinite;
    }
    @keyframes drip {
      0% { transform: translateY(0) scale(0.4); opacity: 0; }
      30% { transform: translateY(2px) scale(1); opacity: 1; }
      70% { transform: translateY(4px) scaleY(1.3); opacity: 1; }
      100% { transform: translateY(26px) scaleY(1.1); opacity: 0; }
    }
    .load-status { margin: 22px 0 0; font-size: 18px; min-height: 1.3em; }
    .load-quote { margin: 26px auto 0; max-width: 300px; font-size: 18px; color: var(--flesh-dim); min-height: 2.6em; }
    .load-quote span { display: block; margin-top: 4px; font-size: 14px; opacity: 0.7; }
    .load-retry {
      margin-top: 14px; padding: 8px 22px; font: inherit; font-size: 18px; color: var(--text);
      background: var(--blood); border: 0; border-radius: 999px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="loading">
    <div>
      <h1 class="logo">Hairy Popsicles</h1>
      <p class="logo-sub">the MMO</p>
      <div class="load-bar"><div class="load-fill"></div></div>
      <p class="load-status">Loading...</p>
      <button class="load-retry" hidden>Try again</button>
      <p class="load-quote"></p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
